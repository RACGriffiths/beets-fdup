# Tests with the oldest supported versions (see pyproject.toml) and with the latest beets, lint, and a check that the
# package builds and installs. release.yml runs this too, before publishing, and uploads the package built here.
#
# fdup reads the library through some beets internals (see beetsplug/fdup/items.py), so a new beets release can break
# it: the latest-beets jobs catch that, and the weekly schedule runs them without a push. (GitHub turns a public repo's
# schedules off after 60 days without activity: the Actions tab has a button to turn them back on.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # Mondays, 05:23 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  workflow_call:           # from release.yml

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (Python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            deps: "beets==2.10.* numpy==2.0.*"
          - python: "3.12"
            deps: beets
          - python: "3.13"
            deps: beets
          - python: "3.14"
            deps: beets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          pip install -e . $DEPS pytest responses
          pip list | grep -iE '^(beets|numpy) '
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  # Builds the sdist and wheel that release.yml uploads to PyPI. The tests above use an editable install, so this also
  # checks that the wheel has everything the plugin needs.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - name: Check the metadata (and that PyPI can render the README)
        run: twine check --strict dist/*
      - name: Check the wheel installs and beets loads the plugin from it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          export BEETSDIR="$RUNNER_TEMP/beets"
          mkdir "$BEETSDIR"
          printf 'library: %s/library.db\nplugins: [fdup]\n' "$BEETSDIR" > "$BEETSDIR/config.yaml"
          "$RUNNER_TEMP/venv/bin/beet" fdup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
