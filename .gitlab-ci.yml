# Tests with the oldest supported versions (see pyproject.toml) and with the latest beets, and lint.
#
# fdup reads the library through some beets internals (see beetsplug/fdup/items.py), so a new beets release can break
# it: the latest-beets jobs catch that. A scheduled pipeline (Build > Pipeline schedules) runs them without a push.

variables:
  PYTHON_VERSION: "3.13"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:${PYTHON_VERSION}
  cache:
    key: pip-${PYTHON_VERSION}
    paths: [.cache/pip]

test:
  parallel:
    matrix:
      - PYTHON_VERSION: "3.11"
        DEPS: "beets==2.10.* numpy==2.0.*"
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
        DEPS: "beets"
  script:
    - pip install -e . $DEPS pytest responses
    - pip list | grep -iE '^(beets|numpy) '
    - pytest

lint:
  script:
    - pip install ruff
    - ruff check .
